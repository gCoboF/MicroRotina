name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Gerar o app
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Juntar app, protótipo e auditoria
        run: |
          mkdir -p app/dist/prototipo app/dist/auditoria
          cp prototipo-penpot/preview.html prototipo-penpot/spec.js app/dist/prototipo/
          cp -r auditoria-mobiledu/relatorio.html auditoria-mobiledu/antes auditoria-mobiledu/depois app/dist/auditoria/
          cp auditoria-mobiledu/Auditoria_MobileDU_MicroRotina_Grupo18.pdf app/dist/auditoria/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
