<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MicroRotina · prévia</title>
<style>
  :root { --bg: #E9ECF4; --ink: #14213D; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Source Sans 3", "Source Sans Pro", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  nav { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; padding: 8px 16px; background: #fff; border-bottom: 1px solid #D5DBE8; align-items: center; }
  nav button { font: inherit; font-weight: 700; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 2px solid #1B4DB8; background: #fff; color: #1B4DB8; cursor: pointer; }
  nav button[aria-pressed="true"] { background: #1B4DB8; color: #fff; }
  #stage { display: flex; justify-content: center; padding: 24px; }
  #grid { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; }
  .label { font-weight: 700; margin: 0 0 6px; font-size: 14px; }
  .bd { position: relative; overflow: hidden; border-radius: 28px; box-shadow: 0 8px 30px rgba(20,33,61,.18); flex: none; }
  .bd * { position: absolute; }
  .bd svg, .bd svg * { position: static; display: block; }
  .t { white-space: pre-line; display: flex; }
  .click { cursor: pointer; }
  .click:hover { outline: 3px dashed rgba(27,77,184,.45); outline-offset: 2px; }
</style>
</head>
<body>
<nav>
  <button id="m-play" aria-pressed="true">Navegar</button>
  <button id="m-all" aria-pressed="false">Todas as telas</button>
  <button id="b-back">← Voltar</button>
  <span id="cur"></span>
</nav>
<div id="stage"></div>
<div id="grid" hidden></div>
<script src="spec.js"></script>
<script>
  const spec = buildSpec();
  const byId = {}; spec.boards.forEach(b => byId[b.id] = b);
  const hist = ['boasvindas'];
  let timer = null;

  function css(el) {
    const o = [];
    if (el.t === 'text' || el.t === 'svg') return '';
    o.push('background:' + (el.fill || 'transparent'));
    if (el.op != null) o.push('opacity:' + el.op);
    if (el.stroke) o.push('border:' + (el.sw || 1) + 'px solid ' + el.stroke);
    if (el.t === 'ellipse') o.push('border-radius:50%');
    else if (el.r) o.push('border-radius:' + el.r + 'px');
    return o.join(';');
  }

  function draw(el, parent, go) {
    if (el.t === 'group') {
      const g = document.createElement('div');
      g.style.cssText = 'left:0;top:0;width:100%;height:100%;pointer-events:none';
      g.title = el.name;
      parent.appendChild(g);
      el.children.forEach(c => draw(c, g, go));
      if (el.action) {
        const xs = el.children.map(c => c.x), ys = el.children.map(c => c.y);
        const xe = el.children.map(c => c.x + c.w), ye = el.children.map(c => c.y + c.h);
        const hit = document.createElement('div');
        hit.className = 'click';
        hit.style.cssText = `left:${Math.min(...xs)}px;top:${Math.min(...ys)}px;width:${Math.max(...xe) - Math.min(...xs)}px;height:${Math.max(...ye) - Math.min(...ys)}px;pointer-events:auto;border-radius:16px`;
        hit.setAttribute('role', 'button'); hit.setAttribute('aria-label', el.name);
        hit.onclick = () => go(el.action);
        g.appendChild(hit);
      }
      return;
    }
    const d = document.createElement('div');
    d.style.cssText = `left:${el.x}px;top:${el.y}px;width:${el.w}px;height:${el.h}px;` + css(el) + (el.rot ? `;transform:rotate(${el.rot}deg)` : '');
    if (el.t === 'svg') d.innerHTML = el.svg;
    if (el.t === 'text') {
      d.className = 't';
      d.textContent = el.text;
      d.style.cssText += `font-size:${el.size}px;font-weight:${el.weight};color:${el.color};line-height:${el.lh || 1.25};text-align:${el.align};align-items:${el.valign === 'center' ? 'center' : 'flex-start'};justify-content:${el.align === 'center' ? 'center' : el.align === 'right' ? 'flex-end' : 'flex-start'};`;
    }
    parent.appendChild(d);
  }

  function render(b, go) {
    const root = document.createElement('div');
    root.className = 'bd';
    root.style.cssText = `width:${b.w}px;height:${b.h}px;background:${b.fill}`;
    b.els.forEach(e => draw(e, root, go));
    return root;
  }

  function nav(a) {
    if (a.back) { if (hist.length > 1) hist.pop(); }
    else if (byId[a.to]) hist.push(a.to);
    show();
  }

  function show() {
    clearTimeout(timer);
    const b = byId[hist[hist.length - 1]];
    const stage = document.getElementById('stage');
    stage.replaceChildren(render(b, nav));
    document.getElementById('cur').textContent = b.name;
    if (b.after) timer = setTimeout(() => nav({ to: b.after.to }), b.after.delay);
  }

  function showAll() {
    const g = document.getElementById('grid');
    g.replaceChildren();
    spec.boards.forEach(b => {
      const w = document.createElement('div');
      const l = document.createElement('p'); l.className = 'label'; l.textContent = b.name;
      w.append(l, render(b, () => {}));
      g.appendChild(w);
    });
  }

  const mp = document.getElementById('m-play'), ma = document.getElementById('m-all');
  function mode(all) {
    mp.setAttribute('aria-pressed', !all); ma.setAttribute('aria-pressed', all);
    document.getElementById('stage').hidden = all;
    document.getElementById('grid').hidden = !all;
    if (all) { clearTimeout(timer); showAll(); } else show();
  }
  mp.onclick = () => mode(false); ma.onclick = () => mode(true);
  document.getElementById('b-back').onclick = () => nav({ back: true });
  const q = new URLSearchParams(location.search);
  if (q.get('b') && byId[q.get('b')]) hist.push(q.get('b'));
  mode(q.get('all') === '1');
</script>
</body>
</html>
