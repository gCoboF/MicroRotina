<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MicroRotina</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 12px; color: #14213D; background: #fff; }
  body[data-theme="dark"] { color: #fff; background: #18181a; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  p { margin: 0 0 12px; }
  button { font: inherit; font-weight: 700; padding: 12px 16px; min-height: 48px; width: 100%; border: 0; border-radius: 12px; background: #1B4DB8; color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #status { margin-top: 12px; font-weight: 600; }
  #status.error { color: #9a3412; }
</style>
</head>
<body>
  <h1>MicroRotina · protótipo</h1>
  <p>Cria o protótipo navegável (telas, fluxos, rastreabilidade e expressões da Nuvi) nesta página do Penpot. Use numa página vazia.</p>
  <button id="go">Gerar protótipo</button>
  <div id="status" role="status" aria-live="polite"></div>
<script>
  const params = new URLSearchParams(location.search);
  document.body.dataset.theme = params.get('theme') || 'light';
  const go = document.getElementById('go'), st = document.getElementById('status');
  go.addEventListener('click', () => {
    go.disabled = true; st.className = ''; st.textContent = 'Começando…';
    parent.postMessage({ type: 'generate' }, '*');
  });
  window.addEventListener('message', (e) => {
    const m = e.data || {};
    if (!m.type) return;
    st.textContent = m.text;
    st.className = m.type === 'error' ? 'error' : '';
    if (m.type === 'done' || m.type === 'error') go.disabled = false;
  });
</script>
</body>
</html>
